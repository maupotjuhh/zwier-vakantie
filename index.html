<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏖️ Zwier's Vakantie Countdown</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏖️</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root { --accent: #fbbf24; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: #0c4a6e;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    position: relative;
    padding: 24px 16px 120px;
  }

  #scene { position: fixed; inset: 0; z-index: 0; }

  header { text-align: center; z-index: 2; }

  .badge {
    display: inline-block;
    background: rgba(8,24,40,.45);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(251,191,36,.55);
    color: var(--accent);
    padding: 6px 18px;
    border-radius: 999px;
    font-size: .85rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 18px;
    text-shadow: 0 1px 3px rgba(0,0,0,.6);
  }

  h1 {
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 800;
    line-height: 1.15;
    text-shadow: 0 2px 6px rgba(0,0,0,.55), 0 8px 30px rgba(0,0,0,.4);
  }
  h1 .name {
    background: linear-gradient(90deg, #fde047, #fb923c);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.45));
  }

  .subtitle {
    margin-top: 12px;
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: rgba(255,255,255,.95);
    text-shadow: 0 1px 4px rgba(0,0,0,.6);
  }

  /* Countdown */
  .countdown {
    display: flex;
    gap: clamp(10px, 2.5vw, 22px);
    margin: 38px 0 8px;
    z-index: 2;
    flex-wrap: wrap;
    justify-content: center;
  }
  .unit {
    background: rgba(8,24,40,.45);
    backdrop-filter: blur(10px) saturate(1.2);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 20px;
    padding: clamp(14px, 2.6vw, 24px) clamp(12px, 2.6vw, 26px);
    text-align: center;
    min-width: clamp(78px, 17vw, 124px);
    box-shadow: 0 10px 30px rgba(0,0,0,.3);
    transition: transform .2s;
  }
  .unit:hover { transform: translateY(-4px); }
  .unit .num {
    font-size: clamp(2.1rem, 6.5vw, 3.7rem);
    font-weight: 800;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
    text-shadow: 0 2px 12px rgba(0,0,0,.5);
    display: inline-block;
  }
  .num.pop { animation: pop .3s ease; }
  @keyframes pop { 40% { transform: scale(1.16); } }
  .unit .lbl {
    margin-top: 6px;
    font-size: clamp(.68rem, 1.8vw, .88rem);
    text-transform: uppercase;
    letter-spacing: 2px;
    color: rgba(255,255,255,.85);
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }

  .workdays {
    z-index: 2;
    margin-top: 16px;
    font-size: clamp(1rem, 2.6vw, 1.25rem);
    background: rgba(8,24,40,.45);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.25);
    padding: 12px 26px;
    border-radius: 999px;
    text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  .workdays b { color: var(--accent); }

  /* Voortgang */
  .progress-wrap {
    z-index: 2;
    width: min(620px, 92vw);
    margin-top: 30px;
    text-align: center;
    background: rgba(8,24,40,.4);
    backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 18px;
    padding: 16px 20px 14px;
  }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: .85rem;
    color: rgba(255,255,255,.85);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 16px;
    background: rgba(255,255,255,.15);
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,.2);
  }
  .progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #fbbf24, #fb923c, #f472b6);
    border-radius: 999px;
    transition: width 1s ease;
    box-shadow: 0 0 14px rgba(251,191,36,.6);
  }
  .progress-pct { margin-top: 8px; font-weight: 700; color: var(--accent); text-shadow: 0 1px 3px rgba(0,0,0,.5); }

  .quote {
    z-index: 2;
    margin-top: 28px;
    font-style: italic;
    color: rgba(255,255,255,.95);
    text-align: center;
    max-width: 560px;
    font-size: clamp(.95rem, 2.2vw, 1.1rem);
    min-height: 2.4em;
    text-shadow: 0 1px 4px rgba(0,0,0,.65);
    transition: opacity .45s;
  }

  /* Vakantie-modus */
  #vacationMsg { display: none; text-align: center; z-index: 2; }
  #vacationMsg .big { font-size: clamp(3rem, 10vw, 6rem); }

</style>
</head>
<body>
  <canvas id="scene"></canvas>

  <header>
    <div class="badge">☀️ Vakantie Countdown ☀️</div>
    <h1>Nog even volhouden, <span class="name">Zwier</span>! 💪</h1>
    <p class="subtitle">Laatste werkdag: <b>donderdag 30 juli</b> &nbsp;·&nbsp; Vakantie vanaf: <b>vrijdag 31 juli</b> 🎉</p>
  </header>

  <div class="countdown" id="countdown">
    <div class="unit"><div class="num" id="d">–</div><div class="lbl">Dagen</div></div>
    <div class="unit"><div class="num" id="h">–</div><div class="lbl">Uren</div></div>
    <div class="unit"><div class="num" id="m">–</div><div class="lbl">Minuten</div></div>
    <div class="unit"><div class="num" id="s">–</div><div class="lbl">Seconden</div></div>
  </div>

  <div class="workdays" id="workdays"></div>

  <div class="progress-wrap" id="progressWrap">
    <div class="progress-label"><span>Vandaag</span><span>🏖️ 31 juli</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-pct" id="progressPct"></div>
  </div>

  <div class="quote" id="quote"></div>

  <div id="vacationMsg">
    <div class="big">🎉🏖️🍹</div>
    <h1>HET IS ZOVER, ZWIER!</h1>
    <p class="subtitle">Je bent officieel MET VAKANTIE! Geniet ervan, je hebt het verdiend! 🌴</p>
  </div>

  <canvas id="confetti" style="position:fixed;inset:0;pointer-events:none;z-index:5;"></canvas>

<script>
  const $ = id => document.getElementById(id);

  /* ============================================================
     LEVENDE STRANDSCÈNE — meekleurend met de echte klok
     ============================================================ */
  const FORCE_T = (() => {
    const v = new URLSearchParams(location.search).get('t');
    return v === null ? null : parseFloat(v);
  })();

  const sceneCv = $('scene'), sc = sceneCv.getContext('2d');
  let W = 0, H = 0, horizonY = 0, shoreY = 0;
  let stars = [], clouds = [], birds = [], speckles = [];

  const C = h => [parseInt(h.slice(1,3),16), parseInt(h.slice(3,5),16), parseInt(h.slice(5,7),16)];
  const mix = (a,b,t) => [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t];
  const rgba = (c,a=1) => `rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
  const clamp01 = v => Math.min(1, Math.max(0, v));

  // Lucht/zee-kleuren per uur: [uur, luchtBoven, luchtMidden, horizon, zeeOndiep, zeeDiep, daglicht]
  const KEYS = [
    [0,   '#050a14','#0a1a2e','#14304a', '#0d2338','#04101c', 0],
    [4.8, '#050a14','#0a1a2e','#14304a', '#0d2338','#04101c', 0],
    [6.1, '#233458','#6d5670','#e2926f', '#31485f','#0c1f30', 0.3],
    [7.6, '#3a7cbc','#7fb2df','#f2d3a0', '#2b6b95','#113a57', 0.8],
    [9.5, '#2b7ac2','#77b5e7','#cfe9f8', '#1e6ca4','#0e4470', 1],
    [17,  '#2b7ac2','#77b5e7','#cfe9f8', '#1e6ca4','#0e4470', 1],
    [19.2,'#3f689c','#c08668','#f2b475', '#3a6183','#13344d', 0.75],
    [20.4,'#2b3560','#84586b','#dd8a5f', '#2b4a64','#0c2336', 0.35],
    [21.6,'#0a1328','#131f3a','#264260', '#122b42','#061320', 0.06],
    [24,  '#050a14','#0a1a2e','#14304a', '#0d2338','#04101c', 0],
  ].map(k => ({ h:k[0], sky:[C(k[1]),C(k[2]),C(k[3])], sea:[C(k[4]),C(k[5])], amb:k[6] }));

  function paletteAt(t) {
    for (let i = 0; i < KEYS.length-1; i++) {
      const A = KEYS[i], B = KEYS[i+1];
      if (t >= A.h && t <= B.h) {
        const u = (t - A.h) / ((B.h - A.h) || 1);
        return {
          sky: [mix(A.sky[0],B.sky[0],u), mix(A.sky[1],B.sky[1],u), mix(A.sky[2],B.sky[2],u)],
          sea: [mix(A.sea[0],B.sea[0],u), mix(A.sea[1],B.sea[1],u)],
          amb: A.amb + (B.amb - A.amb) * u
        };
      }
    }
    return KEYS[0];
  }

  function makeCloud(x) {
    const s = 0.6 + Math.random() * 0.9;
    return {
      x, y: 20 + Math.random() * (horizonY * 0.5), s,
      v: 2.5 + Math.random() * 5,
      puffs: Array.from({length: 5}, () => ({
        dx: (Math.random() - 0.5) * 140 * s,
        dy: (Math.random() - 0.5) * 28 * s,
        r: (16 + Math.random() * 22) * s
      }))
    };
  }

  function initScene() {
    W = sceneCv.width = innerWidth;
    H = sceneCv.height = innerHeight;
    horizonY = Math.round(H * 0.52);
    shoreY = Math.max(horizonY + 130, H - 95);
    stars = Array.from({length: 120}, () => ({
      x: Math.random()*W, y: Math.random()*horizonY*0.95,
      r: Math.random()*1.3 + 0.4, p: Math.random()*6.28
    }));
    clouds = Array.from({length: 7}, () => makeCloud(Math.random()*W));
    speckles = Array.from({length: 90}, () => ({
      x: Math.random()*W, y: shoreY + 14 + Math.random()*(H - shoreY - 16)
    }));
  }
  addEventListener('resize', initScene);
  initScene();

  // kwadratische bezier-punt
  const qp = (p0, c, p1, s) => {
    const u = 1 - s;
    return [u*u*p0[0] + 2*u*s*c[0] + s*s*p1[0], u*u*p0[1] + 2*u*s*c[1] + s*s*p1[1]];
  };

  const frondLens = [1, 0.9, 1.06, 0.84, 1.02, 0.94, 1.1, 0.88];

  function drawPalm(ts, shade) {
    const ph = Math.min(H * 0.42, 310);
    const bx = W - Math.min(W*0.12, 95), by = H - 26;
    const sway = Math.sin(ts*0.55)*0.022 + Math.sin(ts*0.21)*0.014;
    const top = [bx - ph*0.24 + sway*180, by - ph];
    const ctrl = [bx - 6, by - ph*0.5];

    // stam (taps toelopend)
    const trunkC = mix([98,72,50], [30,34,46], 1 - shade);
    for (let s = 0; s < 1; s += 0.07) {
      const [x1,y1] = qp([bx,by], ctrl, top, s);
      const [x2,y2] = qp([bx,by], ctrl, top, Math.min(1, s+0.09));
      sc.strokeStyle = rgba(trunkC);
      sc.lineWidth = 15 - s*9;
      sc.lineCap = 'round';
      sc.beginPath(); sc.moveTo(x1,y1); sc.lineTo(x2,y2); sc.stroke();
    }

    // kokosnoten
    sc.fillStyle = rgba(mix([80,56,36],[20,24,34], 1-shade));
    for (let i = 0; i < 3; i++) {
      sc.beginPath();
      sc.arc(top[0] + (i-1)*9, top[1] + 10, 6, 0, 7);
      sc.fill();
    }

    // bladeren
    const frondC = mix([46,104,60], [16,26,32], 1 - shade);
    for (let i = 0; i < 8; i++) {
      const a = Math.PI*1.06 - i*(Math.PI*1.12/7) + sway*1.5 + Math.sin(ts*1.1 + i*1.7)*0.016;
      const L = ph * 0.55 * frondLens[i];
      const end = [top[0] + Math.cos(a)*L, top[1] + Math.sin(a)*L*0.35 + L*0.55];
      const fc  = [top[0] + Math.cos(a)*L*0.6, top[1] + Math.sin(a)*L*0.2 - L*0.16];
      sc.strokeStyle = rgba(frondC);
      sc.lineWidth = 2.6; sc.lineCap = 'round';
      sc.beginPath(); sc.moveTo(top[0], top[1]); sc.quadraticCurveTo(fc[0], fc[1], end[0], end[1]); sc.stroke();
      // blaadjes langs de nerf
      sc.lineWidth = 1.5;
      for (let s = 0.18; s <= 0.97; s += 0.065) {
        const p = qp(top, fc, end, s);
        const p2 = qp(top, fc, end, Math.min(1, s+0.02));
        const tx = p2[0]-p[0], ty = p2[1]-p[1];
        const tl = Math.hypot(tx,ty) || 1;
        const nx = -ty/tl, ny = tx/tl;
        const ll = 17 * (1 - s*0.62) * (ph/310);
        const bkx = -tx/tl * ll * 0.4, bky = -ty/tl * ll * 0.4;
        sc.beginPath();
        sc.moveTo(p[0], p[1]); sc.lineTo(p[0] + nx*ll + bkx, p[1] + ny*ll + bky);
        sc.moveTo(p[0], p[1]); sc.lineTo(p[0] - nx*ll*0.9 + bkx, p[1] - ny*ll*0.9 + bky);
        sc.stroke();
      }
    }
  }

  function drawProps(shade) {
    const sandBottom = H - 20;
    const px = Math.min(W * 0.15, 170);

    // schaduwvlekken
    sc.fillStyle = 'rgba(60,45,25,0.18)';
    sc.beginPath(); sc.ellipse(px + 12, sandBottom - 2, 60, 9, 0, 0, 7); sc.fill();

    // parasol
    sc.save();
    sc.translate(px, sandBottom);
    sc.rotate(-0.1);
    sc.strokeStyle = rgba(mix([150,120,90],[40,42,52], 1-shade));
    sc.lineWidth = 4;
    sc.beginPath(); sc.moveTo(0, 0); sc.lineTo(6, -92); sc.stroke();
    const cols = [mix([212,70,66],[54,26,32],1-shade), mix([245,240,228],[62,66,80],1-shade)];
    for (let i = 0; i < 6; i++) {
      const a0 = Math.PI + i*(Math.PI/6), a1 = a0 + Math.PI/6;
      sc.fillStyle = rgba(cols[i % 2]);
      sc.beginPath();
      sc.moveTo(6, -88);
      sc.arc(6, -88, 58, a0, a1);
      sc.closePath(); sc.fill();
    }
    sc.fillStyle = rgba(cols[0]);
    sc.beginPath(); sc.arc(6, -92, 4, 0, 7); sc.fill();
    sc.restore();

    // strandstoel
    const chx = px + 92, chy = sandBottom - 4;
    const teal = mix([40,120,130],[24,40,52], 1-shade);
    sc.strokeStyle = rgba(teal); sc.lineWidth = 5; sc.lineCap = 'round';
    sc.beginPath();
    sc.moveTo(chx, chy - 14); sc.lineTo(chx + 34, chy - 14);
    sc.moveTo(chx, chy - 14); sc.lineTo(chx - 14, chy - 36);
    sc.stroke();
    sc.lineWidth = 3;
    sc.beginPath();
    sc.moveTo(chx + 2, chy - 14); sc.lineTo(chx - 4, chy);
    sc.moveTo(chx + 30, chy - 14); sc.lineTo(chx + 36, chy);
    sc.stroke();

    // strandbal
    const bx2 = chx + 58, by2 = sandBottom - 10;
    sc.fillStyle = rgba(mix([244,240,230],[70,74,88],1-shade));
    sc.beginPath(); sc.arc(bx2, by2, 9, 0, 7); sc.fill();
    sc.fillStyle = rgba(mix([214,69,69],[60,30,36],1-shade));
    sc.beginPath(); sc.arc(bx2, by2, 9, -0.6, 1.1); sc.lineTo(bx2, by2); sc.fill();
    sc.fillStyle = rgba(mix([58,110,200],[26,36,60],1-shade));
    sc.beginPath(); sc.arc(bx2, by2, 9, 1.9, 3.6); sc.lineTo(bx2, by2); sc.fill();

    // handdoek
    sc.save();
    sc.translate(px - 70, sandBottom - 8);
    sc.rotate(0.06);
    const tc = [mix([240,150,60],[70,50,36],1-shade), mix([245,240,228],[64,68,82],1-shade)];
    for (let i = 0; i < 4; i++) {
      sc.fillStyle = rgba(tc[i % 2]);
      sc.fillRect(-24, -9 + i*5, 52, 5);
    }
    sc.restore();
  }

  let lastFrame = 0;

  function drawScene(ts) {
    const now = new Date();
    let t = FORCE_T !== null ? FORCE_T : now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
    const P = paletteAt(t);
    const shade = 0.3 + 0.7 * P.amb;
    const dt = Math.min(0.1, ts - lastFrame); lastFrame = ts;

    // === LUCHT ===
    let g = sc.createLinearGradient(0, 0, 0, horizonY);
    g.addColorStop(0, rgba(P.sky[0]));
    g.addColorStop(0.6, rgba(P.sky[1]));
    g.addColorStop(1, rgba(P.sky[2]));
    sc.fillStyle = g;
    sc.fillRect(0, 0, W, horizonY + 1);

    // === STERREN ===
    const starA = Math.max(0, 1 - P.amb * 2.4);
    if (starA > 0.02) {
      sc.fillStyle = '#dfe8f5';
      for (const s of stars) {
        sc.globalAlpha = starA * (0.4 + 0.6 * Math.abs(Math.sin(ts*1.6 + s.p)));
        sc.beginPath(); sc.arc(s.x, s.y, s.r, 0, 7); sc.fill();
      }
      sc.globalAlpha = 1;
    }

    // === ZON ===
    let glintX = null, glintCol = null, glintStr = 0;
    const df = (t - 6.1) / (20.6 - 6.1);
    if (df > -0.02 && df < 1.02) {
      const elev = Math.sin(Math.PI * clamp01(df));
      const sx = W * (0.14 + 0.72 * df);
      const sy = horizonY - 8 - (horizonY - 70) * elev;
      const warm = mix([255,236,190], [255,148,76], 1 - Math.min(1, elev*1.6));
      const glow = sc.createRadialGradient(sx, sy, 0, sx, sy, 130);
      glow.addColorStop(0, rgba(warm, 0.9));
      glow.addColorStop(0.25, rgba(warm, 0.35));
      glow.addColorStop(1, rgba(warm, 0));
      sc.fillStyle = glow;
      sc.fillRect(sx-140, sy-140, 280, 280);
      sc.fillStyle = rgba(mix(warm, [255,255,255], 0.55));
      sc.beginPath(); sc.arc(sx, sy, 16 + 7*(1-elev), 0, 7); sc.fill();
      glintX = sx; glintCol = warm; glintStr = (0.4 + 0.6*(1-elev*0.45)) * Math.min(1, elev*3 + 0.15);
    }

    // === MAAN ===
    const nf = ((t + 24 - 21) % 24) / 9.2;
    if (nf >= 0 && nf <= 1 && P.amb < 0.5) {
      const elev = Math.sin(Math.PI * nf);
      const mx = W * (0.2 + 0.6 * nf);
      const my = horizonY - 60 - (horizonY * 0.45) * elev;
      const mglow = sc.createRadialGradient(mx, my, 0, mx, my, 90);
      mglow.addColorStop(0, 'rgba(200,215,240,0.35)');
      mglow.addColorStop(1, 'rgba(200,215,240,0)');
      sc.fillStyle = mglow;
      sc.fillRect(mx-95, my-95, 190, 190);
      sc.fillStyle = '#e6ebf2';
      sc.beginPath(); sc.arc(mx, my, 20, 0, 7); sc.fill();
      // maria (donkere vlekken) voor een realistisch maanoppervlak
      sc.fillStyle = 'rgba(155,168,190,0.5)';
      sc.beginPath(); sc.arc(mx - 6, my - 4, 5, 0, 7); sc.fill();
      sc.beginPath(); sc.arc(mx + 4, my + 7, 3.5, 0, 7); sc.fill();
      sc.beginPath(); sc.arc(mx + 7, my - 8, 2.5, 0, 7); sc.fill();
      sc.fillStyle = rgba(P.sky[0], 0.85);
      sc.beginPath(); sc.arc(mx + 14, my - 7, 16, 0, 7); sc.fill();
      glintX = mx; glintCol = [205,220,242]; glintStr = 0.35 * (1 - P.amb*1.5);
    }

    // === WOLKEN ===
    const cloudBase = mix([255,255,255], P.sky[2], 0.22);
    const cloudA = 0.1 + 0.55 * P.amb;
    for (const cl of clouds) {
      cl.x += cl.v * dt * 3;
      if (cl.x > W + 220) { Object.assign(cl, makeCloud(-200)); }
      for (const p of cl.puffs) {
        const pg = sc.createRadialGradient(cl.x+p.dx, cl.y+p.dy, 0, cl.x+p.dx, cl.y+p.dy, p.r);
        pg.addColorStop(0, rgba(cloudBase, cloudA));
        pg.addColorStop(1, rgba(cloudBase, 0));
        sc.fillStyle = pg;
        sc.beginPath(); sc.arc(cl.x+p.dx, cl.y+p.dy, p.r, 0, 7); sc.fill();
      }
    }

    // === ZAND ===
    const sandC = mix([230,211,168], [46,50,66], 1 - P.amb*0.92);
    const sandDark = mix(sandC, [0,0,0], 0.22);
    g = sc.createLinearGradient(0, shoreY-40, 0, H);
    g.addColorStop(0, rgba(sandDark));
    g.addColorStop(0.4, rgba(sandC));
    g.addColorStop(1, rgba(sandC));
    sc.fillStyle = g;
    sc.fillRect(0, shoreY - 45, W, H - shoreY + 45);
    // natte zandband
    sc.fillStyle = rgba(mix(sandC, [70,60,45], 0.4), 0.55);
    sc.fillRect(0, shoreY - 26, W, 48);

    // === ZEE ===
    const wash = Math.sin(ts*0.5)*12 + Math.sin(ts*0.23)*5;
    const shoreline = x => shoreY + wash + Math.sin(x*0.01 + ts*0.7)*5 + Math.sin(x*0.023 - ts*0.5)*3;
    g = sc.createLinearGradient(0, horizonY, 0, shoreY + 26);
    g.addColorStop(0, rgba(mix(P.sea[0], P.sky[2], 0.5)));
    g.addColorStop(0.12, rgba(P.sea[0]));
    g.addColorStop(1, rgba(P.sea[1], 0.94));
    sc.beginPath();
    sc.moveTo(0, horizonY);
    sc.lineTo(W, horizonY);
    for (let x = W; x >= 0; x -= 10) sc.lineTo(x, shoreline(x));
    sc.closePath();
    sc.fillStyle = g;
    sc.fill();

    // === GLINSTERING (zon/maan-spoor op het water) ===
    if (glintX !== null && glintStr > 0.02) {
      for (let y = horizonY + 5; y < shoreY - 8; y += 5) {
        const f = (y - horizonY) / (shoreY - horizonY);
        const w = 8 + f * 90;
        const flick = Math.sin(y*13.7 + ts*6) + Math.sin(y*7.3 - ts*4.2);
        const a = Math.max(0, 0.03 + 0.09*flick/2) * (1 - f*0.45) * glintStr;
        if (a <= 0.004) continue;
        const dx = Math.sin(y*3.1 + ts*2)*w*0.3;
        sc.fillStyle = rgba(glintCol, a);
        sc.fillRect(glintX - w/2 + dx, y, w*(0.4 + 0.3*Math.abs(flick)/2), 2.2);
      }
    }

    // === GOLFLIJNEN ===
    for (let k = 0; k < 4; k++) {
      const baseY = horizonY + (shoreY - horizonY) * (0.16 + 0.21*k);
      const amp = 1.5 + k*2.4;
      sc.beginPath();
      for (let x = 0; x <= W; x += 8) {
        const y = baseY + Math.sin(x*0.012/(k*0.3+1) + ts*(0.7 + k*0.25) + k*2)*amp
                        + Math.sin(x*0.03 + ts*1.3 + k)*amp*0.4;
        x === 0 ? sc.moveTo(x,y) : sc.lineTo(x,y);
      }
      sc.strokeStyle = `rgba(255,255,255,${(0.05 + 0.035*k) * (0.35 + 0.65*P.amb)})`;
      sc.lineWidth = 1.2 + k*0.7;
      sc.stroke();
    }

    // === ZEILBOOT ===
    const cycle = W + 340;
    const prog = (ts * 11) % cycle;
    const lap = Math.floor((ts * 11) / cycle);
    const bx = lap % 2 === 0 ? prog - 170 : W + 170 - prog;
    const bob = Math.sin(ts*1.4)*1.3;
    const byy = horizonY - 1 + bob;
    const dirF = lap % 2 === 0 ? 1 : -1;
    sc.fillStyle = `rgba(30,36,48,${0.55 + 0.35*P.amb})`;
    sc.beginPath();
    sc.moveTo(bx - 24, byy); sc.lineTo(bx + 24, byy);
    sc.lineTo(bx + 16, byy + 8); sc.lineTo(bx - 16, byy + 8);
    sc.closePath(); sc.fill();
    sc.strokeStyle = `rgba(30,36,48,${0.5 + 0.4*P.amb})`;
    sc.lineWidth = 2;
    sc.beginPath(); sc.moveTo(bx + 2*dirF, byy); sc.lineTo(bx + 2*dirF, byy - 30); sc.stroke();
    sc.fillStyle = rgba(mix([240,238,230], [90,96,116], 1 - P.amb), 0.95);
    sc.beginPath();
    sc.moveTo(bx + 3*dirF, byy - 3); sc.lineTo(bx + 3*dirF, byy - 29); sc.lineTo(bx + 20*dirF, byy - 7);
    sc.closePath(); sc.fill();
    sc.beginPath();
    sc.moveTo(bx - 1*dirF, byy - 4); sc.lineTo(bx - 1*dirF, byy - 23); sc.lineTo(bx - 14*dirF, byy - 6);
    sc.closePath(); sc.fill();
    if (P.amb < 0.3) {
      sc.fillStyle = 'rgba(255,210,120,0.9)';
      sc.beginPath(); sc.arc(bx + 4*dirF, byy - 6, 1.6, 0, 7); sc.fill();
    }
    // spiegeling
    sc.fillStyle = `rgba(20,26,38,${0.12 + 0.1*P.amb})`;
    sc.beginPath(); sc.ellipse(bx, byy + 11, 22, 3, 0, 0, 7); sc.fill();

    // === BRANDING / SCHUIMRAND ===
    sc.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = shoreline(x);
      x === 0 ? sc.moveTo(x,y) : sc.lineTo(x,y);
    }
    sc.strokeStyle = `rgba(255,255,255,${0.35 + 0.35*P.amb})`;
    sc.lineWidth = 2.5;
    sc.stroke();
    // terugtrekkend schuimspoor
    const wash2 = Math.sin((ts-1.7)*0.5)*12 + Math.sin((ts-1.7)*0.23)*5;
    sc.beginPath();
    for (let x = 0; x <= W; x += 10) {
      const y = shoreY + wash2 + Math.sin(x*0.01 + (ts-1.7)*0.7)*5 + Math.sin(x*0.023 - (ts-1.7)*0.5)*3;
      x === 0 ? sc.moveTo(x,y) : sc.lineTo(x,y);
    }
    sc.strokeStyle = `rgba(255,255,255,${0.08 + 0.08*P.amb})`;
    sc.lineWidth = 4;
    sc.stroke();

    // === ZANDDETAIL ===
    sc.fillStyle = `rgba(90,70,45,${0.05 + 0.07*P.amb})`;
    for (const sp of speckles) {
      sc.fillRect(sp.x, sp.y, 2, 1.4);
    }

    // === STRANDSPULLEN & PALM ===
    drawProps(shade);
    drawPalm(ts, shade);

    // === MEEUWEN ===
    if (P.amb > 0.35 && Math.random() < dt / 9) {
      const fromLeft = Math.random() < 0.5;
      const n = 1 + Math.floor(Math.random()*3);
      for (let i = 0; i < n; i++) {
        birds.push({
          x: fromLeft ? -30 - i*26 : W + 30 + i*26,
          y: 40 + Math.random()*horizonY*0.55 + i*12,
          vx: (fromLeft ? 1 : -1) * (26 + Math.random()*22),
          size: 7 + Math.random()*6,
          phase: Math.random()*6.28
        });
      }
    }
    sc.lineCap = 'round';
    for (let i = birds.length-1; i >= 0; i--) {
      const b = birds[i];
      b.x += b.vx * dt;
      b.y += Math.sin(ts*1.2 + b.phase)*0.25;
      if (b.x < -60 || b.x > W + 60) { birds.splice(i,1); continue; }
      const flap = Math.sin(ts*7 + b.phase);
      const dy = flap * b.size * 0.55;
      sc.strokeStyle = `rgba(25,35,48,${0.4 + 0.4*P.amb})`;
      sc.lineWidth = 1.8;
      sc.beginPath();
      sc.moveTo(b.x - b.size, b.y - dy);
      sc.quadraticCurveTo(b.x - b.size*0.25, b.y + 2, b.x, b.y);
      sc.quadraticCurveTo(b.x + b.size*0.25, b.y + 2, b.x + b.size, b.y - dy);
      sc.stroke();
    }
  }

  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reducedMotion) {
    drawScene(0.001);
    setInterval(() => drawScene(performance.now()/1000), 30000);
  } else {
    (function frame(ms) {
      drawScene(ms/1000);
      requestAnimationFrame(frame);
    })(0);
  }

  /* ============================================================
     COUNTDOWN
     ============================================================ */
  const now0 = new Date();
  let year = now0.getFullYear();
  let target = new Date(year, 6, 31, 0, 0, 0); // 31 juli
  if (now0 > new Date(year, 7, 31)) target = new Date(year + 1, 6, 31);

  const PROGRESS_KEY = 'zwierCountdownStart';
  let progressStart;
  try {
    progressStart = localStorage.getItem(PROGRESS_KEY);
    if (!progressStart) {
      progressStart = now0.getTime();
      localStorage.setItem(PROGRESS_KEY, progressStart);
    }
  } catch (e) { progressStart = now0.getTime(); }
  progressStart = Number(progressStart);

  const quotes = [
    "☕ Nog even doorbikkelen, dan liggen de voeten omhoog!",
    "🌴 Elke werkdag is er één dichter bij het strand.",
    "😎 Zonnebril alvast gepoetst, Zwier?",
    "🧳 De koffer kan bijna van zolder!",
    "🍹 De cocktails staan al bijna koud...",
    "⏰ Tik tak... de vakantie komt eraan!",
    "💼 Werk hard nu, chill hard straks.",
    "🏖️ Het zand wacht op je, Zwier!",
    "🛫 Bijna tijd om de out-of-office aan te zetten!",
    "🥳 Het weekend duurt straks wekenlang!"
  ];

  function workdaysUntil(from, to) {
    let count = 0;
    const d = new Date(from.getFullYear(), from.getMonth(), from.getDate());
    const end = new Date(to.getFullYear(), to.getMonth(), to.getDate());
    while (d < end) {
      const dow = d.getDay();
      if (dow !== 0 && dow !== 6) count++;
      d.setDate(d.getDate() + 1);
    }
    return count;
  }

  function pad(n) { return String(n).padStart(2, '0'); }

  let vacationStarted = false;
  let lastSec = -1;

  function tick() {
    const now = new Date();
    const diff = target - now;

    if (diff <= 0) {
      if (!vacationStarted) startVacation();
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor(diff / 3600000) % 24;
    const mins = Math.floor(diff / 60000) % 60;
    const secs = Math.floor(diff / 1000) % 60;

    $('d').textContent = days;
    $('h').textContent = pad(hours);
    $('m').textContent = pad(mins);
    $('s').textContent = pad(secs);

    if (secs !== lastSec && !reducedMotion) {
      lastSec = secs;
      const el = $('s');
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }

    const wd = workdaysUntil(now, target);
    $('workdays').innerHTML = wd === 0
      ? "🎉 <b>Geen werkdagen meer!</b> Alleen nog even wachten..."
      : `💼 Nog maar <b>${wd}</b> werkdag${wd === 1 ? '' : 'en'} te gaan!`;

    const total = target - progressStart;
    const done = now - progressStart;
    const pct = Math.min(100, Math.max(0, (done / total) * 100));
    $('progressFill').style.width = pct + '%';
    $('progressPct').textContent = pct.toFixed(1) + '% van het wachten is voorbij';
  }

  function rotateQuote() {
    const q = quotes[Math.floor(Date.now() / 10000) % quotes.length];
    const el = $('quote');
    if (el.textContent === q) return;
    el.style.opacity = '0';
    setTimeout(() => { el.textContent = q; el.style.opacity = '1'; }, 450);
  }

  function startVacation() {
    vacationStarted = true;
    $('countdown').style.display = 'none';
    $('workdays').style.display = 'none';
    $('progressWrap').style.display = 'none';
    $('quote').style.display = 'none';
    document.querySelector('header').style.display = 'none';
    $('vacationMsg').style.display = 'block';
    launchConfetti();
  }

  function launchConfetti() {
    const canvas = $('confetti');
    const ctx = canvas.getContext('2d');
    canvas.width = innerWidth; canvas.height = innerHeight;
    const colors = ['#fbbf24','#fb923c','#f472b6','#34d399','#60a5fa','#fde047'];
    const parts = Array.from({length: 220}, () => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * canvas.height,
      w: 6 + Math.random() * 8,
      h: 10 + Math.random() * 8,
      c: colors[Math.floor(Math.random() * colors.length)],
      vy: 2 + Math.random() * 3,
      vx: -1.5 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: -0.1 + Math.random() * 0.2
    }));
    (function anim() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const p of parts) {
        p.y += p.vy; p.x += p.vx; p.rot += p.vr;
        if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.c;
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
        ctx.restore();
      }
      requestAnimationFrame(anim);
    })();
  }

  tick();
  rotateQuote();
  $('quote').style.opacity = '1';
  setInterval(tick, 1000);
  setInterval(rotateQuote, 10000);
</script>
</body>
</html>
