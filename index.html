<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🇸🇪 Zwier / Juni – Göteborg Countdown</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:#020810}
  #scene{display:block;position:fixed;inset:0;width:100%;height:100%}
  #ui{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:clamp(6px,1.5vh,14px)}
  .flag-bar{font-size:clamp(22px,4vw,38px)}
  #title{color:#fff;font-size:clamp(14px,2.4vw,22px);font-weight:700;letter-spacing:.06em;text-shadow:0 2px 12px #000a;text-align:center}
  #subtitle{color:#FECC02;font-size:clamp(10px,1.6vw,15px);letter-spacing:.12em;text-shadow:0 1px 8px #000a;text-align:center}
  #countdown{display:flex;gap:clamp(8px,2vw,24px);align-items:flex-end}
  .unit{display:flex;flex-direction:column;align-items:center;gap:2px}
  .num{font-size:clamp(32px,7vw,80px);font-weight:900;line-height:1;color:#fff;text-shadow:0 0 30px rgba(0,106,167,.8),0 2px 16px #000}
  .lbl{font-size:clamp(8px,1.1vw,11px);letter-spacing:.15em;color:#FECC02;text-transform:uppercase;font-weight:600}
  .sep{font-size:clamp(28px,5vw,60px);font-weight:900;color:#fff;padding-bottom:.1em;opacity:.6;line-height:1.1}
  #progress-wrap{width:clamp(220px,55vw,520px);display:flex;flex-direction:column;gap:4px}
  #prog-label{color:#adf;font-size:clamp(8px,1vw,10px);letter-spacing:.12em;text-align:center}
  #prog-bg{background:rgba(255,255,255,.12);border-radius:99px;height:7px;overflow:hidden}
  #prog-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#006AA7,#FECC02);transition:width .6s ease}
  #quote{color:rgba(255,255,255,.75);font-size:clamp(9px,1.3vw,13px);font-style:italic;text-align:center;max-width:420px;padding:0 16px;text-shadow:0 1px 6px #000}
  #date-line{color:rgba(254,204,2,.8);font-size:clamp(8px,1.1vw,11px);letter-spacing:.1em;text-shadow:0 1px 6px #000}
  #celebration{position:fixed;inset:0;background:rgba(0,20,60,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:100}
  #celebration h1{color:#FECC02;font-size:clamp(28px,6vw,64px);font-weight:900;text-align:center;text-shadow:0 0 40px #FECC02}
  #celebration p{color:#fff;font-size:clamp(14px,2.5vw,22px);text-align:center;max-width:600px}
  #confetti-canvas{position:fixed;inset:0;pointer-events:none;z-index:99}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<canvas id="confetti-canvas"></canvas>
<div id="ui">
  <div class="flag-bar">🇸🇪</div>
  <div id="title">ZWIER / JUNI ✈ GÖTEBORG</div>
  <div id="subtitle">26 NOVEMBER 2026 · 09:45</div>
  <div id="countdown">
    <div class="unit"><span class="num" id="d-days">--</span><span class="lbl">dagen</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="d-hours">--</span><span class="lbl">uren</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="d-min">--</span><span class="lbl">min</span></div>
    <div class="sep">:</div>
    <div class="unit"><span class="num" id="d-sec">--</span><span class="lbl">sec</span></div>
  </div>
  <div id="progress-wrap">
    <div id="prog-label">VOORTGANG</div>
    <div id="prog-bg"><div id="prog-fill" style="width:0%"></div></div>
  </div>
  <div id="quote"></div>
  <div id="date-line">🛫 Vlucht naar Göteborg · Scandinavisch avontuur!</div>
</div>
<div id="celebration">
  <h1>🇸🇪 HET IS ZOVER!</h1>
  <p>ZWIER / JUNI, jullie vliegen naar GÖTEBORG!<br>Geniet van Zweden! 🦐 🌊 ❄️</p>
</div>
<script>
(function(){
'use strict';
const TARGET=new Date(2026,10,26,9,45,0);
const LS_KEY='zwierGoteborg2026';
const QUOTES=[
  '🇸🇪 Hej hej, Göteborg! Jullie komen eraan!',
  '🦐 Räkmacka\'s bij de Feskekörka... bijna tijd!',
  '❄️ Scandinavisch avontuur staat op het programma!',
  '☕ Zweedse fika en kanelbullar wachten al op jullie!',
  '🌊 De westkust van Zweden roept jullie naam!',
  '🧣 Zwier / Juni, alvast een dikke jas in de koffer!',
  '🌟 Misschien zelfs een glimp van het noorderlicht?',
  '🎄 Göteborg in november — sprookjesachtig mooi!',
  '🏰 Haga-wijk + glühwein = perfecte sfeer!',
  '✈️ Nog even, dan is het out-of-office tijd!',
];
const cv=document.getElementById('scene');
const ctx=cv.getContext('2d');
let W=0,H=0;

function hex(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function rgb(c,a=1){return 'rgba('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+','+a+')';}
function lerpc(a,b,t){return[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function C(h){return hex(h);}

const KEYS=[
  {h:0, top:C('#020810'),mid:C('#050d1e'),bot:C('#091425'),gt:C('#0a1522'),amb:0},
  {h:5, top:C('#020810'),mid:C('#050d1e'),bot:C('#091425'),gt:C('#0a1522'),amb:0},
  {h:7, top:C('#1a2545'),mid:C('#2e3560'),bot:C('#5a4a5e'),gt:C('#1e2e3e'),amb:0.1},
  {h:8, top:C('#3a5070'),mid:C('#607888'),bot:C('#98b0bc'),gt:C('#4a6070'),amb:0.5},
  {h:11,top:C('#4a6478'),mid:C('#788a98'),bot:C('#aec0cc'),gt:C('#5a7080'),amb:0.65},
  {h:14,top:C('#486075'),mid:C('#768898'),bot:C('#aabfcc'),gt:C('#586e7e'),amb:0.65},
  {h:15.5,top:C('#2e3f65'),mid:C('#5a4a72'),bot:C('#c47858'),gt:C('#3e4e60'),amb:0.3},
  {h:16.5,top:C('#1a2550'),mid:C('#352858'),bot:C('#8a4858'),gt:C('#1e2840'),amb:0.08},
  {h:18,top:C('#020810'),mid:C('#050d1e'),bot:C('#091425'),gt:C('#0a1522'),amb:0},
  {h:24,top:C('#020810'),mid:C('#050d1e'),bot:C('#091425'),gt:C('#0a1522'),amb:0},
];

function getSky(hour){
  for(let i=0;i<KEYS.length-1;i++){
    const a=KEYS[i],b=KEYS[i+1];
    if(hour>=a.h&&hour<=b.h){
      const t=(hour-a.h)/(b.h-a.h);
      return{top:lerpc(a.top,b.top,t),mid:lerpc(a.mid,b.mid,t),bot:lerpc(a.bot,b.bot,t),gt:lerpc(a.gt,b.gt,t),amb:a.amb+(b.amb-a.amb)*t};
    }
  }
  return KEYS[0];
}

let stars=[],snowflakes=[],clouds=[],winLights=[];

function initScene(){
  stars=[];
  for(let i=0;i<200;i++) stars.push({x:Math.random()*W,y:Math.random()*H*0.65,r:Math.random()*1.4+0.3,tw:Math.random()*Math.PI*2,ts:0.4+Math.random()*0.6});
  snowflakes=[];
  for(let i=0;i<200;i++) snowflakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2.5+0.8,vx:(Math.random()-0.5)*0.4,vy:0.4+Math.random()*0.8,alpha:0.4+Math.random()*0.5,sw:Math.random()*Math.PI*2,ss:0.3+Math.random()*0.4});
  clouds=[];
  for(let i=0;i<7;i++) clouds.push({x:Math.random()*W*1.5-W*0.25,y:H*0.05+Math.random()*H*0.18,w:W*(0.1+Math.random()*0.15),speed:0.08+Math.random()*0.12,alpha:0.05+Math.random()*0.1});
  winLights=[];
}

const urlH=new URLSearchParams(location.search).get('t');
function getHour(){if(urlH!==null)return parseFloat(urlH);const n=new Date();return n.getHours()+n.getMinutes()/60;}

function drawSky(sk){
  const grd=ctx.createLinearGradient(0,0,0,H);
  grd.addColorStop(0,rgb(sk.top));grd.addColorStop(0.55,rgb(sk.mid));grd.addColorStop(1,rgb(sk.bot));
  ctx.fillStyle=grd;ctx.fillRect(0,0,W,H);
}

function drawStars(sk,ts){
  const a=Math.max(0,1-sk.amb*5);if(a<0.01)return;
  stars.forEach(s=>{const tw=Math.sin(ts*s.ts+s.tw);ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+(a*(0.4+tw*0.5))+')';ctx.fill();});
}

function drawAurora(ts,amb){
  if(amb>0.15)return;
  const gy=H*0.72;
  const bands=[
    {base:0.10,amp:0.045,freq:2.4,phase:ts*0.00018,col:[0,255,130],op:0.14},
    {base:0.17,amp:0.055,freq:1.9,phase:ts*0.00013+1.5,col:[60,180,255],op:0.09},
    {base:0.07,amp:0.03,freq:3.1,phase:ts*0.0002+0.8,col:[120,80,255],op:0.08},
    {base:0.22,amp:0.04,freq:1.5,phase:ts*0.00015+3.0,col:[0,220,180],op:0.06},
  ];
  bands.forEach(b=>{
    const oy=gy*(b.base+b.amp*Math.sin(b.freq+b.phase));
    const grd=ctx.createLinearGradient(0,oy-H*0.08,0,oy+H*0.04);
    grd.addColorStop(0,'rgba('+b.col.join(',')+',0)');
    grd.addColorStop(0.5,'rgba('+b.col.join(',')+','+b.op+')');
    grd.addColorStop(1,'rgba('+b.col.join(',')+',0)');
    ctx.save();
    ctx.beginPath();
    for(let x=0;x<=W;x+=4){const wy=oy+Math.sin(x/W*b.freq*Math.PI*2+b.phase)*H*b.amp;x===0?ctx.moveTo(x,wy):ctx.lineTo(x,wy);}
    ctx.lineTo(W,oy+H*0.05);ctx.lineTo(0,oy+H*0.05);ctx.closePath();
    ctx.fillStyle=grd;ctx.fill();ctx.restore();
  });
}

function drawMoon(sk,ts){
  const a=Math.max(0,1-sk.amb*4);if(a<0.01)return;
  const mx=W*0.75,my=H*0.14;
  ctx.save();
  const mg=ctx.createRadialGradient(mx,my,0,mx,my,H*0.08);
  mg.addColorStop(0,'rgba(220,220,180,'+(a*0.25)+')');mg.addColorStop(1,'transparent');
  ctx.fillStyle=mg;ctx.beginPath();ctx.arc(mx,my,H*0.08,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(mx,my,H*0.038,0,Math.PI*2);ctx.fillStyle=rgb([220,215,185],a);ctx.fill();
  [[0.3,0.2,0.012],[-.25,0.1,0.009],[0.1,-.3,0.007]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(mx+dx*H*0.038,my+dy*H*0.038,r*H,0,Math.PI*2);ctx.fillStyle='rgba(170,165,145,'+(a*0.35)+')';ctx.fill();});
  ctx.restore();
}

function drawSun(sk){
  if(sk.amb<0.1)return;
  const sx=W*0.3,sy=H*0.22,sr=H*0.025;
  ctx.save();
  const sg=ctx.createRadialGradient(sx,sy,0,sx,sy,sr*4);
  sg.addColorStop(0,'rgba(255,220,160,'+(sk.amb*0.4)+')');sg.addColorStop(1,'transparent');
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,sy,sr*4,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(sx,sy,sr,0,Math.PI*2);ctx.fillStyle='rgba(255,210,140,'+(sk.amb*0.6)+')';ctx.fill();
  ctx.restore();
}

function drawClouds(){
  clouds.forEach(c=>{
    c.x+=c.speed;if(c.x>W+c.w)c.x=-c.w;
    ctx.save();
    for(let i=0;i<4;i++){
      const cx2=c.x+i*c.w*0.3,cy2=c.y+(i%2)*c.w*0.1,r=c.w*(0.22+i*0.04);
      const cg=ctx.createRadialGradient(cx2,cy2,0,cx2,cy2,r);
      cg.addColorStop(0,'rgba(160,175,190,'+(c.alpha*1.4)+')');cg.addColorStop(1,'transparent');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx2,cy2,r,0,Math.PI*2);ctx.fill();
    }
    ctx.restore();
  });
}

function drawGround(sk){
  const gy=H*0.72;
  ctx.save();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,gy);
  for(let x=0;x<=W;x+=W*0.08) ctx.quadraticCurveTo(x+W*0.04,gy-H*0.015,x+W*0.08,gy);
  ctx.lineTo(W,H);ctx.closePath();
  const gg=ctx.createLinearGradient(0,gy,0,H);
  gg.addColorStop(0,rgb([210,225,235]));gg.addColorStop(0.3,rgb([185,205,220]));gg.addColorStop(1,rgb([140,165,185]));
  ctx.fillStyle=gg;ctx.fill();ctx.restore();
}

function computeWindowLights(gy){
  winLights=[];
  const zones=[
    {x:W*0.31,y:gy-H*0.22,w:W*0.02,h:H*0.15,cols:3,rows:7},
    {x:W*0.36,y:gy-H*0.22,w:W*0.02,h:H*0.15,cols:3,rows:7},
    {x:W*0.52,y:gy-H*0.13,w:W*0.03,h:H*0.1,cols:3,rows:4},
    {x:W*0.72,y:gy-H*0.11,w:W*0.015,h:H*0.09,cols:2,rows:4},
    {x:W*0.07,y:gy-H*0.11,w:W*0.015,h:H*0.09,cols:2,rows:4},
  ];
  zones.forEach((z,zi)=>{
    const cw=z.w/z.cols,rh=z.h/z.rows;
    for(let r=0;r<z.rows;r++) for(let c=0;c<z.cols;c++){
      const idx=zi*100+r*10+c;
      if(((idx*31+r*7+c*13)%100)<55){
        winLights.push({x:z.x+c*cw+cw*0.2,y:z.y+r*rh+rh*0.2,w:cw*0.6,h:rh*0.6,warm:((idx*17)%3)===0});
      }
    }
  });
}

function drawCity(sk,amb){
  const gy=H*0.72;
  if(winLights.length===0) computeWindowLights(gy);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(0,gy);
  ctx.lineTo(W*0.02,gy-H*0.04);ctx.lineTo(W*0.04,gy-H*0.07);ctx.lineTo(W*0.06,gy-H*0.07);
  ctx.lineTo(W*0.07,gy-H*0.11);ctx.lineTo(W*0.08,gy-H*0.11);ctx.lineTo(W*0.09,gy-H*0.08);
  ctx.lineTo(W*0.11,gy-H*0.08);ctx.lineTo(W*0.12,gy-H*0.05);ctx.lineTo(W*0.14,gy-H*0.05);
  ctx.lineTo(W*0.3,gy-H*0.07);
  ctx.lineTo(W*0.31,gy-H*0.22);ctx.lineTo(W*0.33,gy-H*0.22);ctx.lineTo(W*0.33,gy-H*0.07);
  ctx.lineTo(W*0.35,gy-H*0.07);
  ctx.lineTo(W*0.36,gy-H*0.22);ctx.lineTo(W*0.38,gy-H*0.22);ctx.lineTo(W*0.38,gy-H*0.07);
  ctx.lineTo(W*0.44,gy-H*0.07);
  ctx.lineTo(W*0.45,gy-H*0.14);ctx.lineTo(W*0.455,gy-H*0.20);ctx.lineTo(W*0.46,gy-H*0.14);
  ctx.lineTo(W*0.47,gy-H*0.07);
  ctx.lineTo(W*0.52,gy-H*0.09);ctx.lineTo(W*0.54,gy-H*0.09);ctx.lineTo(W*0.55,gy-H*0.13);
  ctx.lineTo(W*0.57,gy-H*0.13);ctx.lineTo(W*0.58,gy-H*0.09);
  ctx.lineTo(W*0.63,gy-H*0.09);
  ctx.lineTo(W*0.635,gy-H*0.26);ctx.lineTo(W*0.64,gy-H*0.26);ctx.lineTo(W*0.645,gy-H*0.09);
  ctx.lineTo(W*0.70,gy-H*0.06);ctx.lineTo(W*0.72,gy-H*0.11);ctx.lineTo(W*0.73,gy-H*0.11);
  ctx.lineTo(W*0.74,gy-H*0.08);ctx.lineTo(W*0.82,gy-H*0.08);ctx.lineTo(W*0.84,gy-H*0.12);
  ctx.lineTo(W*0.85,gy-H*0.12);ctx.lineTo(W*0.86,gy-H*0.08);ctx.lineTo(W*0.9,gy-H*0.07);
  ctx.lineTo(W,gy-H*0.04);ctx.lineTo(W,gy);ctx.closePath();
  ctx.fillStyle=rgb(sk.gt);ctx.fill();
  const btx=W*0.638,bty=gy-H*0.26;
  const bc=[Math.round(sk.gt[0]*1.3),Math.round(sk.gt[1]*1.3),Math.round(sk.gt[2]*1.5)];
  ctx.strokeStyle=rgb(bc,0.6);ctx.lineWidth=1;
  for(let i=0;i<12;i++){
    ctx.beginPath();ctx.moveTo(btx,bty);ctx.lineTo(W*(0.60+i*0.012),gy-H*0.07);ctx.stroke();
    ctx.beginPath();ctx.moveTo(btx+W*0.004,bty);ctx.lineTo(W*(0.648+i*0.011),gy-H*0.07);ctx.stroke();
  }
  ctx.fillStyle=rgb(bc);ctx.fillRect(W*0.59,gy-H*0.07,W*0.14,H*0.008);
  ctx.restore();
  const wa=Math.max(0,0.9-amb*2.5);
  if(wa>0.01) winLights.forEach(w=>{
    ctx.fillStyle=w.warm?'rgba(255,220,140,'+(wa*0.8)+')':`rgba(190,220,255,${wa*0.6})`;
    ctx.fillRect(w.x,w.y,w.w,w.h);
  });
}

function drawWater(sk,ts){
  const gy=H*0.72,ry=gy+H*0.03;
  ctx.save();
  const wg=ctx.createLinearGradient(0,ry,0,ry+H*0.08);
  wg.addColorStop(0,rgb(lerpc(sk.bot,[20,40,80],0.4),0.7));wg.addColorStop(1,rgb(sk.bot,0.3));
  ctx.fillStyle=wg;ctx.fillRect(0,ry,W,H*0.08);
  ctx.strokeStyle='rgba(255,255,255,0.08)';ctx.lineWidth=1;
  for(let i=0;i<5;i++){const ry2=ry+H*0.015*(i+1),off=Math.sin(ts*0.001+i)*W*0.02;ctx.beginPath();ctx.moveTo(W*0.3+off,ry2);ctx.lineTo(W*0.7+off,ry2);ctx.stroke();}
  ctx.restore();
}

function drawSnow(){
  snowflakes.forEach(s=>{
    s.x+=s.vx+Math.sin(s.sw)*0.3;s.sw+=s.ss*0.01;s.y+=s.vy;
    if(s.y>H+5)s.y=-5;if(s.x<-5)s.x=W+5;if(s.x>W+5)s.x=-5;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,'+s.alpha+')';ctx.fill();
  });
}

function drawGirl(gx,groundY,dir,amb,ts){
  const dim=0.3+amb*0.65;
  const tint=([r,g,b])=>[Math.round(r*dim),Math.round(g*dim),Math.round(b*dim)];
  const isLeft=dir===1;
  const c=tint(isLeft?[0,90,160]:[200,155,0]);
  const s2=tint(isLeft?[200,155,0]:[0,90,160]);
  const hat=tint(isLeft?[200,155,0]:[0,90,160]);
  const bt=tint([30,30,40]);
  const hr=tint([235,195,80]);
  const sk2=tint([240,195,160]);
  const h=Math.min(H*0.22,Math.min(W*0.14,170));
  const waveAmt=dir*(0.4+Math.sin(ts*0.001*0.9)*0.12);
  const windSway=Math.sin(ts*0.001*0.3)*h*0.02*dir;
  ctx.save();
  ctx.translate(gx+windSway,groundY);
  ctx.beginPath();ctx.ellipse(0,0,h*0.08,h*0.02,0,0,Math.PI*2);ctx.fillStyle='rgba(0,0,0,0.25)';ctx.fill();
  ctx.fillStyle=rgb(bt);
  ctx.fillRect(-h*0.09*dir,-h*0.14,h*0.07,h*0.14);ctx.fillRect(h*0.02*dir,-h*0.14,h*0.07,h*0.14);
  ctx.fillStyle=rgb(tint([40,50,70]));
  ctx.fillRect(-h*0.085*dir,-h*0.28,h*0.065,h*0.14);ctx.fillRect(h*0.022*dir,-h*0.28,h*0.065,h*0.14);
  ctx.fillStyle=rgb(c);
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(-h*0.14,-h*0.68,h*0.28,h*0.42,h*0.03);
  else ctx.rect(-h*0.14,-h*0.68,h*0.28,h*0.42);
  ctx.fill();
  for(let i=0;i<3;i++){ctx.beginPath();ctx.arc(0,-h*0.6+i*h*0.09,h*0.015,0,Math.PI*2);ctx.fillStyle=rgb(s2);ctx.fill();}
  ctx.save();ctx.translate(-h*0.14*dir,-h*0.56);ctx.rotate((-0.3-waveAmt*0.3)*dir);
  ctx.fillStyle=rgb(c);ctx.fillRect(-h*0.055,-h*0.2,h*0.07,h*0.22);
  ctx.fillStyle=rgb(tint([200,80,80]));ctx.beginPath();ctx.ellipse(0,-h*0.22,h*0.06,h*0.07,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.save();ctx.translate(h*0.14*dir,-h*0.56);ctx.rotate(0.15*dir);
  ctx.fillStyle=rgb(c);ctx.fillRect(-h*0.015,-h*0.2,h*0.07,h*0.22);
  ctx.fillStyle=rgb(tint([200,80,80]));ctx.beginPath();ctx.ellipse(h*0.02,-h*0.22,h*0.06,h*0.07,0,0,Math.PI*2);ctx.fill();
  ctx.restore();
  ctx.fillStyle=rgb(s2);
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(-h*0.1,-h*0.75,h*0.2,h*0.08,h*0.03);ctx.fill();}
  else{ctx.fillRect(-h*0.1,-h*0.75,h*0.2,h*0.08);}
  ctx.beginPath();ctx.ellipse(h*0.03*dir,-h*0.73,h*0.03,h*0.025,0,0,Math.PI*2);ctx.fillStyle=rgb(tint([s2[0]+20,s2[1]+20,s2[2]+20]));ctx.fill();
  ctx.fillStyle=rgb(hr);
  ctx.beginPath();ctx.ellipse(-dir*h*0.02,-h*0.88,h*0.11,h*0.14,0.2*dir,0,Math.PI*2);ctx.fill();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*h*0.06,-h*0.78);ctx.quadraticCurveTo(i*h*0.1+dir*h*0.03,-h*0.6,i*h*0.09,-h*0.38);ctx.lineWidth=h*0.028;ctx.strokeStyle=rgb(hr);ctx.stroke();}
  ctx.fillStyle=rgb(sk2);ctx.beginPath();ctx.ellipse(0,-h*0.88,h*0.1,h*0.12,0,0,Math.PI*2);ctx.fill();
  ctx.fillStyle=rgb(hat);
  ctx.beginPath();ctx.ellipse(0,-h*0.95,h*0.11,h*0.07,0,0,Math.PI*2);ctx.fill();
  ctx.fillRect(-h*0.11,-h*1.08,h*0.22,h*0.15);
  ctx.beginPath();ctx.ellipse(0,-h*1.08,h*0.11,h*0.04,0,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(dir*h*0.02,-h*1.1,h*0.038,0,Math.PI*2);ctx.fillStyle=rgb(tint([255,255,255]));ctx.fill();
  ctx.fillStyle=rgb(hr);ctx.beginPath();
  ctx.moveTo(-h*0.08,-h*0.98);ctx.quadraticCurveTo(-h*0.09,-h*0.86,-h*0.06,-h*0.8);
  ctx.quadraticCurveTo(-h*0.1,-h*0.78,-h*0.07,-h*0.76);ctx.quadraticCurveTo(-h*0.05,-h*0.74,-h*0.03,-h*0.76);
  ctx.closePath();ctx.fill();
  const ex=dir*h*0.03;
  ctx.beginPath();ctx.ellipse(ex,-h*0.9,h*0.015,h*0.018,0,0,Math.PI*2);ctx.fillStyle=rgb(tint([40,30,20]));ctx.fill();
  ctx.beginPath();ctx.arc(ex+h*0.005*dir,-h*0.904,h*0.006,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,0.7)';ctx.fill();
  ctx.beginPath();ctx.moveTo(ex-h*0.025,-h*0.915);ctx.lineTo(ex+h*0.025,-h*0.912);ctx.lineWidth=h*0.012;ctx.strokeStyle=rgb(tint([100,70,30]));ctx.stroke();
  ctx.beginPath();ctx.ellipse(ex,-h*0.875,h*0.028,h*0.018,0,0,Math.PI*2);ctx.fillStyle='rgba('+tint([255,160,140]).join(',')+',0.4)';ctx.fill();
  ctx.beginPath();ctx.arc(0,-h*0.868,h*0.03,0.2,Math.PI-0.2);ctx.lineWidth=h*0.01;ctx.strokeStyle=rgb(tint([180,80,60]));ctx.stroke();
  ctx.restore();
}

let ts0=null;
function frame(now){
  if(!ts0)ts0=now;
  const ts=now-ts0;
  if(W===0){requestAnimationFrame(frame);return;}
  const hour=getHour(),sk=getSky(hour),gy=H*0.72;
  drawSky(sk);drawStars(sk,ts);drawAurora(ts,sk.amb);drawMoon(sk,ts);drawSun(sk);
  drawClouds();drawWater(sk,ts);drawGround(sk);drawCity(sk,sk.amb);
  drawGirl(W*0.14,gy,1,sk.amb,ts);drawGirl(W*0.86,gy,-1,sk.amb,ts);
  drawSnow();
  requestAnimationFrame(frame);
}

function resize(){
  W=cv.width=window.innerWidth;H=cv.height=window.innerHeight;
  winLights=[];initScene();
}
window.addEventListener('resize',resize);

let quoteIdx=0,quoteTimer=0;
function getStartTs(){try{let v=localStorage.getItem(LS_KEY);if(!v){v=Date.now().toString();localStorage.setItem(LS_KEY,v);}return parseInt(v,10);}catch(e){return Date.now();}}
const startTs=getStartTs();

function updateCountdown(){
  const now=Date.now(),diff=TARGET.getTime()-now;
  if(diff<=0){document.getElementById('celebration').style.display='flex';startConfetti();return;}
  const d=Math.floor(diff/86400000);
  const h=Math.floor((diff%86400000)/3600000);
  const m=Math.floor((diff%3600000)/60000);
  const s=Math.floor((diff%60000)/1000);
  document.getElementById('d-days').textContent=d;
  document.getElementById('d-hours').textContent=String(h).padStart(2,'0');
  document.getElementById('d-min').textContent=String(m).padStart(2,'0');
  document.getElementById('d-sec').textContent=String(s).padStart(2,'0');
  const pct=Math.min(100,Math.max(0,(now-startTs)/(TARGET.getTime()-startTs)*100));
  document.getElementById('prog-fill').style.width=pct+'%';
  quoteTimer++;if(quoteTimer%80===0||quoteTimer===1){quoteIdx=(quoteIdx+1)%QUOTES.length;document.getElementById('quote').textContent=QUOTES[quoteIdx];}
  setTimeout(updateCountdown,1000);
}

let confParts=[];
function startConfetti(){
  const cc=document.getElementById('confetti-canvas');
  cc.width=window.innerWidth;cc.height=window.innerHeight;
  const cctx=cc.getContext('2d');
  const cols=['#FECC02','#006AA7','#ffffff','#FFD700','#4FC3F7'];
  for(let i=0;i<140;i++) confParts.push({x:Math.random()*window.innerWidth,y:-10-Math.random()*200,vx:(Math.random()-0.5)*3,vy:2+Math.random()*3,r:4+Math.random()*6,rot:Math.random()*360,vr:(Math.random()-0.5)*6,col:cols[Math.floor(Math.random()*cols.length)]});
  function cf(){
    cctx.clearRect(0,0,cc.width,cc.height);
    confParts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;if(p.y>cc.height+20)p.y=-20;cctx.save();cctx.translate(p.x,p.y);cctx.rotate(p.rot*Math.PI/180);cctx.fillStyle=p.col;cctx.fillRect(-p.r/2,-p.r/2,p.r,p.r);cctx.restore();});
    requestAnimationFrame(cf);
  }cf();
}

const rmotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches;
resize();updateCountdown();
if(!rmotion) requestAnimationFrame(frame);
else{const hour=getHour(),sk=getSky(hour),gy=H*0.72;drawSky(sk);drawGround(sk);drawCity(sk,sk.amb);drawGirl(W*0.14,gy,1,sk.amb,0);drawGirl(W*0.86,gy,-1,sk.amb,0);}
})();
</script>
